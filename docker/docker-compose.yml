# Star Wars Galaxies Server - Docker Compose Configuration
# Full stack deployment for SWG server infrastructure

services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  mysql:
    image: mysql:8.0
    container_name: swg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-swg_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-swgemu}
      MYSQL_USER: ${MYSQL_USER:-swgemu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-swgemu_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - swg-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-swg_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: swg-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-swg_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - swg-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-swg_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # SWG Server Applications
  # =============================================================================

  login-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.login-server
    container_name: swg-login-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVER_TYPE: login-server
      LOGIN_SERVER_PORT: 44453
      # Database
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-swgemu}
      DATABASE_USER: ${MYSQL_USER:-swgemu}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-swgemu_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-swg_redis_password}
      # Server Settings
      SERVER_NAME: ${SERVER_NAME:-SWG Server}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${LOGIN_SERVER_PORT:-44453}:44453/udp"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swg-network
    volumes:
      - login_logs:/app/logs

  connection-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.connection-server
    container_name: swg-connection-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVER_TYPE: connection-server
      CONNECTION_SERVER_PORT: 44455
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-swg_redis_password}
      # Server Settings
      SERVER_NAME: ${SERVER_NAME:-SWG Server}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Game server discovery
      GAME_SERVER_HOST: game-server
      GAME_SERVER_BASE_PORT: 44460
    ports:
      - "${CONNECTION_SERVER_PORT:-44455}:44455/udp"
    depends_on:
      redis:
        condition: service_healthy
      login-server:
        condition: service_started
    networks:
      - swg-network
    volumes:
      - connection_logs:/app/logs

  chat-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.chat-server
    container_name: swg-chat-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVER_TYPE: chat-server
      CHAT_SERVER_PORT: 44462
      # Database
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-swgemu}
      DATABASE_USER: ${MYSQL_USER:-swgemu}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-swgemu_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-swg_redis_password}
      # Server Settings
      SERVER_NAME: ${SERVER_NAME:-SWG Server}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${CHAT_SERVER_PORT:-44462}:44462/tcp"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swg-network
    volumes:
      - chat_logs:/app/logs

  game-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.game-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVER_TYPE: game-server
      GAME_SERVER_PORT: 44460
      # Database
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-swgemu}
      DATABASE_USER: ${MYSQL_USER:-swgemu}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-swgemu_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-swg_redis_password}
      # Server Settings
      SERVER_NAME: ${SERVER_NAME:-SWG Server}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Chat server
      CHAT_SERVER_HOST: chat-server
      CHAT_SERVER_PORT: 44462
      # Connection server
      CONNECTION_SERVER_HOST: connection-server
      CONNECTION_SERVER_PORT: 44455
    ports:
      - "44460-44469:44460/udp"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chat-server:
        condition: service_started
      connection-server:
        condition: service_started
    networks:
      - swg-network
    volumes:
      - game_logs:/app/logs
      - game_data:/app/data
    deploy:
      mode: replicated
      replicas: 1

# =============================================================================
# Networks
# =============================================================================

networks:
  swg-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  login_logs:
    driver: local
  connection_logs:
    driver: local
  chat_logs:
    driver: local
  game_logs:
    driver: local
  game_data:
    driver: local
